[project]
name = "wekker"
version = "0.1.0"
description = "Slimme fysieke schoolwekker — softwarebasis (laptop-testbaar, Pi-klaar)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aventus projectteam" }]
dependencies = ["qrcode[pil]>=7.4,<9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
