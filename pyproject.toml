[project]
name = "wekker"
version = "10.1.1"
description = "WakeSync slimme fysieke schoolwekker — Raspberry Pi 5 software"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WakeSync projectteam" }]
dependencies = ["qrcode[pil]>=7.4,<9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
wekker = ["assets/*.png"]
